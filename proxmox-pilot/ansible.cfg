[defaults]
inventory = inventory.yml
roles_path = roles
library = library
module_utils = module_utils
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
timeout = 30
local_tmp = .state/tmp
home = .state/ansible

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
control_path_dir = .state/cp
# Keep socket names ASCII: macOS ssh diagnostics may escape UTF-8 bytes.
control_path = .state/cp/%%C
