# managed-by: safehost-billing-public:v1
server {
    listen 80 default_server;
    server_name {{ billing_public_host }};
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/safehost-acme;
        try_files $uri =404;
        limit_except GET { deny all; }
    }
    location / { return 503; }
}
