# managed-by: safehost-billing-public:v1
limit_req_zone $binary_remote_addr zone=safehost_login:10m rate=6r/m;
server {
    listen 80 default_server;
    server_name 80.249.131.4;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/safehost-acme;
        try_files $uri =404;
        limit_except GET { deny all; }
    }
    location / { return 308 https://80.249.131.4$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name 80.249.131.4;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/safehost-billing-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/safehost-billing-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 2m;
    if ($host != 80.249.131.4) { return 444; }
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    proxy_set_header Host 80.249.131.4;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host 80.249.131.4;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    location ~ ^/(?:config[^/]*\.php|composer\.(?:json|lock)|\.env|\.git)(?:/|$) { return 404; }
    location ^~ /data/portal { return 404; }
    location = /portal.php {
        allow 157.228.152.183;
        deny all;
        proxy_read_timeout 970s;
        proxy_pass http://127.0.0.1:8088;
    }
    location = /admin-portal.php {
        allow 157.228.152.183;
        deny all;
        proxy_read_timeout 970s;
        proxy_pass http://127.0.0.1:8088;
    }
    location = /api/guest/staff/login {
        limit_req zone=safehost_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8088;
    }
    location / { proxy_pass http://127.0.0.1:8088; }
}
