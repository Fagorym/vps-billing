---
- name: Проверить публичные порты Selectel
  hosts: proxmox
  gather_facts: false
  vars:
    ansible_ssh_private_key_file: "{{ pilot_host_key }}"
    ansible_ssh_common_args: "-o UserKnownHostsFile={{ pilot_known_hosts | quote }} -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o ControlMaster=no -o ControlPath=none"
  tasks:
    - name: Проверить hostname и endpoint до изменения конфигурации
      ansible.builtin.assert:
        that:
          - billing_public_host is match('^(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$')
          - billing_public_host | length < 254
    - name: Проверить порты и чужие NAT-правила
      ansible.builtin.script:
        cmd: "{{ billing_root }}/public/nat.py --check"
        executable: /usr/bin/python3
      changed_when: false
    - name: Добавить VM биллинга
      ansible.builtin.add_host:
        name: billing_vm
        groups: billing_public
        ansible_host: "{{ engine.public_ip }}"
        ansible_port: 2223
        ansible_user: vpsadmin
        ansible_ssh_private_key_file: "{{ pilot_guest_key }}"
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_common_args: "-o UserKnownHostsFile={{ pilot_known_hosts | quote }} -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o ControlMaster=no -o ControlPath=none"

- name: Подготовить nginx для проверки сертификата
  hosts: billing_public
  gather_facts: false
  become: true
  vars:
    certbot_image: certbot/certbot@sha256:c23159d30afdd9c97960578aa4654f5901de6cae394958f894074dedd55e599d
  tasks:
    - name: Отказаться менять чужую конфигурацию nginx
      ansible.builtin.shell: |
        set -eu
        for file in /etc/nginx/sites-enabled/*; do
          test -e "$file" || continue
          case "$file" in
            /etc/nginx/sites-enabled/default) ;;
            /etc/nginx/sites-enabled/safehost-billing)
              grep -q 'managed-by: safehost-billing-public:v1' "$file" ;;
            *) echo "Foreign nginx site: $file"; exit 1 ;;
          esac
        done
      changed_when: false
    - name: Установить nginx
      ansible.builtin.apt:
        name: [nginx, ca-certificates]
        update_cache: true
        cache_valid_time: 3600
    - name: Получить закреплённый официальный образ Certbot 5.4
      ansible.builtin.command: "docker pull {{ certbot_image }}"
      register: image_pull
      changed_when: "'Downloaded newer' in image_pull.stdout"
    - name: Создать каталоги сертификата и его проверки
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - {path: /etc/letsencrypt, mode: '0700'}
        - {path: /etc/letsencrypt-staging, mode: '0700'}
        - {path: /var/lib/letsencrypt, mode: '0700'}
        - {path: /var/log/letsencrypt, mode: '0700'}
        - {path: /var/lib/safehost-acme/.well-known/acme-challenge, mode: '0755'}
        - {path: /opt/billing-pilot/public, mode: '0700'}
        - {path: /root/safehost-public-backup, mode: '0700'}
    - name: Проверить существующий сертификат
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/safehost-billing-ip/fullchain.pem
      register: certificate
    - name: Сохранить начальную конфигурацию без доступа к биллингу по HTTP
      ansible.builtin.template:
        src: "{{ billing_root }}/public/nginx-bootstrap.conf"
        dest: /etc/nginx/sites-available/safehost-billing
        mode: '0644'
      when: not certificate.stat.exists
    - name: Отключить стандартный сайт nginx
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
    - name: Включить конфигурацию биллинга
      ansible.builtin.file:
        src: /etc/nginx/sites-available/safehost-billing
        dest: /etc/nginx/sites-enabled/safehost-billing
        state: link
    - name: Проверить конфигурацию nginx
      ansible.builtin.command: nginx -t
      changed_when: false
    - name: Запустить nginx
      ansible.builtin.systemd_service:
        name: nginx
        enabled: true
        state: restarted

- name: Направить публичные HTTP и HTTPS в VM 101
  hosts: proxmox
  gather_facts: false
  vars:
    ansible_ssh_private_key_file: "{{ pilot_host_key }}"
    ansible_ssh_common_args: "-o UserKnownHostsFile={{ pilot_known_hosts | quote }} -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o ControlMaster=no -o ControlPath=none"
  tasks:
    - name: Повторно проверить порты перед изменением NAT
      ansible.builtin.script:
        cmd: "{{ billing_root }}/public/nat.py --check"
        executable: /usr/bin/python3
      changed_when: false
    - name: Сохранить отдельный NAT публичной панели
      ansible.builtin.copy:
        src: "{{ billing_root }}/public/nat.py"
        dest: /usr/local/lib/safehost-billing/public-nat.py
        mode: '0750'
    - name: Сохранить сервис публичного NAT
      ansible.builtin.copy:
        dest: /etc/systemd/system/safehost-billing-web-nat.service
        mode: '0644'
        content: |
          # managed-by: safehost-billing-public:v1
          [Unit]
          Description=Safehost billing public web NAT
          After=network-online.target proxmox-pilot-nat.service safehost-billing-nat.service
          Wants=network-online.target
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/bin/python3 /usr/local/lib/safehost-billing/public-nat.py
          [Install]
          WantedBy=multi-user.target
    - name: Включить NAT сейчас и при загрузке
      ansible.builtin.systemd_service:
        name: safehost-billing-web-nat
        daemon_reload: true
        enabled: true
        state: restarted

- name: Получить доверенный сертификат IP и включить публичный биллинг
  hosts: billing_public
  gather_facts: false
  become: true
  vars:
    certbot_image: certbot/certbot@sha256:c23159d30afdd9c97960578aa4654f5901de6cae394958f894074dedd55e599d
    certbot_base: "docker run --rm --network host -v /var/lib/letsencrypt:/var/lib/letsencrypt -v /var/log/letsencrypt:/var/log/letsencrypt -v /var/lib/safehost-acme:/var/www/acme"
    certbot_request: "certonly --non-interactive --agree-tos --register-unsafely-without-email --preferred-profile shortlived --webroot --webroot-path /var/www/acme {{ ('--ip-address ' + engine.public_ip) if billing_public_host == engine.public_ip else ('-d ' + billing_public_host) }} --cert-name safehost-billing-ip"
    compose: docker compose -p safehost-billing --project-directory /opt/billing-pilot -f /opt/billing-pilot/compose.yml
  tasks:
    - name: Проверить выпуск сертификата в staging
      ansible.builtin.command: "{{ certbot_base }} -v /etc/letsencrypt-staging:/etc/letsencrypt {{ certbot_image }} {{ certbot_request }} --staging"
      when: not certificate.stat.exists
    - name: Получить доверенный сертификат Let's Encrypt
      ansible.builtin.command: "{{ certbot_base }} -v /etc/letsencrypt:/etc/letsencrypt {{ certbot_image }} {{ certbot_request }}"
    - name: Сохранить исходную конфигурацию FOSSBilling для отката
      ansible.builtin.command: "docker cp safehost-billing-billing-1:/var/www/html/config.php /root/safehost-public-backup/config.php"
      args:
        creates: /root/safehost-public-backup/config.php
      no_log: true
    - name: Сохранить настройку URL и доверенного прокси
      ansible.builtin.copy:
        src: "{{ billing_root }}/public/configure.php"
        dest: /opt/billing-pilot/public/configure.php
        mode: '0644'
    - name: Получить адрес Docker gateway прокси
      ansible.builtin.command:
        argv: [docker, inspect, safehost-billing-billing-1, --format, '{{ "{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}" }}']
      register: proxy_gateway
      changed_when: false
    - name: Передать настройку внутрь контейнера
      ansible.builtin.command: "docker cp /opt/billing-pilot/public/configure.php safehost-billing-billing-1:/tmp/safehost-public-configure.php"
    - name: Настроить HTTPS URL в FOSSBilling
      ansible.builtin.command: "{{ compose }} exec -T --user 33:33 billing php /tmp/safehost-public-configure.php {{ proxy_gateway.stdout | trim }} {{ billing_public_host }}"
    - name: Включить nginx HTTPS и принудительный редирект с HTTP
      ansible.builtin.template:
        src: "{{ billing_root }}/public/nginx.conf"
        dest: /etc/nginx/sites-available/safehost-billing
        mode: '0644'
    - name: Проверить nginx перед применением
      ansible.builtin.command: nginx -t
      changed_when: false
    - name: Применить HTTPS
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
    - name: Сохранить продление и загрузку нового сертификата
      ansible.builtin.copy:
        src: "{{ billing_root }}/public/renew.sh"
        dest: /usr/local/sbin/safehost-billing-renew
        mode: '0750'
        validate: /bin/sh -n %s
    - name: Сохранить службу продления
      ansible.builtin.copy:
        dest: /etc/systemd/system/safehost-billing-renew.service
        mode: '0644'
        content: |
          [Unit]
          Description=Renew Safehost billing IP certificate and reload nginx
          After=network-online.target docker.service nginx.service
          Wants=network-online.target
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/safehost-billing-renew
    - name: Проверять продление каждые 12 часов
      ansible.builtin.copy:
        dest: /etc/systemd/system/safehost-billing-renew.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Automatic renewal of Safehost billing IP certificate
          [Timer]
          OnCalendar=*-*-* 00,12:00:00
          RandomizedDelaySec=3600
          Persistent=true
          [Install]
          WantedBy=timers.target
    - name: Включить автоматическое продление
      ansible.builtin.systemd_service:
        name: safehost-billing-renew.timer
        enabled: true
        state: started
        daemon_reload: true
    - name: Проверить настоящее продление через staging без замены сертификата
      ansible.builtin.command: /usr/local/sbin/safehost-billing-renew --dry-run --no-random-sleep-on-renew
      async: 600
      poll: 5
      changed_when: false
